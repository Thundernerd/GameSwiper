name: Release

# Pushing a version tag (vX.Y.Z, or vX.Y.Z-suffix for a pre-release) builds the backend for every
# target, packs each with the built frontend, and publishes a GitHub Release. See README "Releasing".
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  version:
    name: Check version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Match tag to backend/Cargo.toml and frontend/package.json
        id: check
        run: bash .github/scripts/check-release-version.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  frontend:
    name: Frontend
    needs: [version, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate against the live API
        run: npm run generate
        env:
          NUXT_PUBLIC_USE_MOCK: 'false'

      # useMock defaults to true (nuxt.config.ts); the release must call /api, not the fixtures.
      - name: Check the app is built in live mode
        run: grep -q 'useMock:false' .output/public/index.html

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: frontend
          path: frontend/.output/public
          if-no-files-found: error

  backend:
    name: Backend (${{ matrix.suffix }})
    needs: [version, ci]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, suffix: linux-x86_64 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, suffix: linux-arm64 }
          - { target: aarch64-apple-darwin, runner: macos-15, suffix: macos-arm64 }
          # Cross-compiled: Apple's clang builds the bundled SQLite for both architectures.
          - { target: x86_64-apple-darwin, runner: macos-15, suffix: macos-x86_64 }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025, suffix: windows-x86_64, exe: .exe }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm, suffix: windows-arm64, exe: .exe }
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install rustup if the image lacks it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command rustup -ErrorAction SilentlyContinue) { exit 0 }
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain none --profile minimal
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install Rust toolchain
        # Installs the channel listed in backend/rust-toolchain.toml, plus the target.
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      # ring needs clang on PATH to build for aarch64-pc-windows-msvc.
      - name: Put clang on PATH
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          if (Get-Command clang -ErrorAction SilentlyContinue) { exit 0 }
          $llvm = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path "$llvm\clang.exe")) { choco install llvm -y --no-progress }
          $llvm | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: backend-${{ matrix.suffix }}
          path: backend/target/${{ matrix.target }}/release/hypecheck_api${{ matrix.exe }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, ci, frontend, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          path: build

      - name: Pack archives
        run: |
          for dir in build/backend-*; do
            suffix="${dir#build/backend-}"
            binary="$(find "$dir" -type f -name 'hypecheck_api*')"

            # Fail rather than publish a binary built for the wrong OS or architecture.
            case "$suffix" in
              linux-x86_64) expected='ELF 64-bit.*x86-64' ;;
              linux-arm64) expected='ELF 64-bit.*aarch64' ;;
              macos-x86_64) expected='Mach-O 64-bit.*x86_64' ;;
              macos-arm64) expected='Mach-O 64-bit.*arm64' ;;
              windows-x86_64) expected='PE32\+.*x86-64' ;;
              windows-arm64) expected='PE32\+.*Aarch64' ;;
              *) echo "::error::unexpected build $dir"; exit 1 ;;
            esac
            description="$(file -b "$binary")"
            echo "$suffix: $description"
            if ! grep -Eiq "$expected" <<<"$description"; then
              echo "::error::$suffix binary is not $expected"
              exit 1
            fi

            bash .github/scripts/package-release.sh \
              "$VERSION" "$suffix" "$binary" build/frontend .env.example dist
          done

          count="$(find dist -maxdepth 1 -type f | wc -l)"
          if [[ "$count" -ne 6 ]]; then
            echo "::error::expected 6 archives, found $count"
            exit 1
          fi
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Hype Check $VERSION" \
            --generate-notes \
            "${flags[@]}"
