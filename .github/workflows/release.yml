name: Release

# Pushing a version tag (vX.Y.Z, or vX.Y.Z-suffix for a pre-release) builds the backend for every
# target, packs each with the built frontend, and publishes a GitHub Release. It also publishes a
# multi-arch container image to GHCR. See README "Releasing" and "Docker".
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# Jobs pin runner images (ubuntu-24.04, not ubuntu-latest) like the build matrix, which needs exact
# labels such as ubuntu-24.04-arm, so every release job builds on a known image.
jobs:
  version:
    name: Check version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Match tag to backend/Cargo.toml and frontend/package.json
        id: check
        run: bash .github/scripts/check-release-version.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  frontend:
    name: Frontend
    needs: [version, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate against the live API
        run: npm run generate
        env:
          NUXT_PUBLIC_USE_MOCK: 'false'

      # useMock defaults to true (nuxt.config.ts); the release must call /api, not the fixtures.
      - name: Check the app is built in live mode
        run: grep -q 'useMock:false' .output/public/index.html

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: frontend
          path: frontend/.output/public
          if-no-files-found: error

  backend:
    name: Backend (${{ matrix.suffix }})
    needs: [version, ci]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, suffix: linux-x86_64 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, suffix: linux-arm64 }
          - { target: aarch64-apple-darwin, runner: macos-15, suffix: macos-arm64 }
          # Cross-compiled: Apple's clang builds the bundled SQLite for both architectures.
          - { target: x86_64-apple-darwin, runner: macos-15, suffix: macos-x86_64 }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025, suffix: windows-x86_64, ext: .exe }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm, suffix: windows-arm64, ext: .exe }
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install rustup if the image lacks it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command rustup -ErrorAction SilentlyContinue) { exit 0 }
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain none --profile minimal
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install Rust toolchain
        # Installs the channel listed in backend/rust-toolchain.toml, plus the target.
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      # ring needs clang on PATH to build for aarch64-pc-windows-msvc.
      - name: Put clang on PATH
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          if (Get-Command clang -ErrorAction SilentlyContinue) { exit 0 }
          $llvm = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path "$llvm\clang.exe")) { choco install llvm -y --no-progress }
          $llvm | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: backend-${{ matrix.suffix }}
          path: backend/target/${{ matrix.target }}/release/hypecheck_api${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, ci, frontend, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          path: build

      - name: Pack archives
        run: |
          for dir in build/backend-*; do
            suffix="${dir#build/backend-}"
            binary="$(find "$dir" -type f -name 'hypecheck_api*')"

            # Fail rather than publish a binary built for the wrong OS or architecture.
            case "$suffix" in
              linux-x86_64) expected='ELF 64-bit.*x86-64' ;;
              linux-arm64) expected='ELF 64-bit.*aarch64' ;;
              macos-x86_64) expected='Mach-O 64-bit.*x86_64' ;;
              macos-arm64) expected='Mach-O 64-bit.*arm64' ;;
              windows-x86_64) expected='PE32\+.*x86-64' ;;
              windows-arm64) expected='PE32\+.*Aarch64' ;;
              *) echo "::error::unexpected build $dir"; exit 1 ;;
            esac
            description="$(file -b "$binary")"
            echo "$suffix: $description"
            if ! grep -Eiq "$expected" <<<"$description"; then
              echo "::error::$suffix binary is not $expected"
              exit 1
            fi

            bash .github/scripts/package-release.sh \
              "$VERSION" "$suffix" "$binary" build/frontend .env.example dist
          done

          count="$(find dist -maxdepth 1 -type f | wc -l)"
          if [[ "$count" -ne 6 ]]; then
            echo "::error::expected 6 archives, found $count"
            exit 1
          fi
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Hype Check $VERSION" \
            --generate-notes \
            "${flags[@]}"

  # Each architecture builds on its own runner and is pushed by digest only, untagged. Building
  # under QEMU instead would take many times longer to compile the backend.
  image:
    name: Image (${{ matrix.platform }})
    needs: [version, ci]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04, suffix: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, suffix: arm64 }
    steps:
      - name: Name the image
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        # Registries reject uppercase repository names.
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.suffix }}
          cache-to: type=gha,scope=image-${{ matrix.suffix }},mode=max

      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.suffix }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines the per-architecture digests into one manifest list and tags it.
  image-manifest:
    name: Image manifest
    needs: [version, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create and push the manifest list
        run: |
          mapfile -t tags < <(bash .github/scripts/docker-tags.sh "$IMAGE" "$VERSION" "$PRERELEASE")
          image="${tags[0]%:*}"

          sources=()
          for digest in digests/*; do sources+=("$image@sha256:${digest#digests/}"); done
          if [[ "${#sources[@]}" -ne 2 ]]; then
            echo "::error::expected 2 digests, found ${#sources[@]}"
            exit 1
          fi

          flags=()
          for tag in "${tags[@]}"; do flags+=(--tag "$tag"); done
          docker buildx imagetools create "${flags[@]}" "${sources[@]}"

      - name: Check both architectures are published
        run: |
          tag="$(bash .github/scripts/docker-tags.sh "$IMAGE" "$VERSION" "$PRERELEASE" | head -n 1)"
          docker buildx imagetools inspect "$tag"
          platforms="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' \
            | jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' | sort -u)"
          for platform in linux/amd64 linux/arm64; do
            if ! grep -qx "$platform" <<<"$platforms"; then
              echo "::error::$tag has no $platform image"
              exit 1
            fi
          done
